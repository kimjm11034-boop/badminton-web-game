<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ASTRA COURT · 경기 모션</title><link rel="stylesheet" href="./studio.css">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script></head><body>
<header><div class="brand"><i></i> ASTRA <span>COURT</span></div><nav>경기 모션 컬렉션</nav><div class="files"><a href="./Astra-Court.blend" download>Blender 원본 ↓</a><a class="download" href="./athlete.glb" download="Astra-Court-Athlete.glb">선수·모션 GLB ↓</a></div></header>
<main><section class="player"><div id="stage"><div class="intro"><small id="category"></small><h1 id="name">경기 모션</h1><p id="english"></p></div><div class="angles" aria-label="카메라"><button data-view="hero">사선</button><button data-view="rear">후면</button><button data-view="side">측면</button><button data-view="front">정면</button></div><output id="loading">선수 모델을 불러오는 중…</output><div class="orbit">드래그로 회전 · 휠로 확대</div></div>
<div class="transport"><div class="transport-head"><button id="play" aria-label="재생">▶</button><div><small>재생 구간</small><strong id="phase">준비</strong></div><output id="clock">0.00 s</output><select aria-label="재생 속도" id="speed"><option value=".25">0.25×</option><option value=".5" selected>0.5×</option><option value="1">1×</option></select><button id="loop" aria-pressed="true">반복</button></div><input id="time" aria-label="재생 위치" type="range" min="0" max="1000" value="540"><div class="ticks"><button id="before">타격 전</button><button id="peak">타격 구간</button><button id="after">타격 후</button><button id="show-turn" aria-pressed="false">회전축 보기</button></div><output id="turn-values" hidden></output></div></section>
<aside><div class="side-head"><small>MOTION LIBRARY</small><h2>동작 목록 <em id="count"></em></h2></div><div id="filters"></div><div id="list"></div><details id="data"><summary>동작 제작 근거</summary><p id="details"></p><a href="./SOURCES.md" target="_blank">자료와 측정 방법 ↗</a></details></aside></main>
